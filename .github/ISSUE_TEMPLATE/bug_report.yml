name: Bug report
description: Report a bug in wynn.tools
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      description: Which tool is affected?
      options:
        - Builder
        - Map
        - Crafter
        - Atlas
        - Sharing
        - General
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser-os
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 124 on macOS 14
    validations:
      required: true
  - type: input
    id: wynncraft-version
    attributes:
      label: Wynncraft version (if relevant)
      placeholder: e.g. 2.1.3
