name: generate-wynndle

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ vars.API_BASE_URL || 'https://api.wynn.tools' }}/v1/wynndle/today?mode=weapon" > /dev/null
      - run: curl -fsS "${{ vars.API_BASE_URL || 'https://api.wynn.tools' }}/v1/wynndle/today?mode=armor" > /dev/null
