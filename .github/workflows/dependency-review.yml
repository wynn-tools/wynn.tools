name: Dependency review

on:
  pull_request:
    paths:
      - pnpm-lock.yaml

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: BUSL-1.1, Commons-Clause, SSPL-1.0
