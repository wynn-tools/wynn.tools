services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: wynn
      POSTGRES_PASSWORD: wynn
      POSTGRES_DB: wynn_test
    ports:
      - '5433:5432'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wynn -d wynn_test]
      interval: 2s
      timeout: 3s
      retries: 20
