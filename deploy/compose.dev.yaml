services:
  postgres-dev:
    image: postgres:16
    environment:
      POSTGRES_USER: wynn
      POSTGRES_PASSWORD: wynn
      POSTGRES_DB: wynn_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wynn -d wynn_dev]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-dev-data:
